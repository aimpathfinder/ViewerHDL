appId: com.viewerhdl.app
productName: ViewerHDL
asar: true
asarUnpack:
  - tools/**/*
files:
  - dist/**/*
  - electron/**/*
  - tools/**/*
  - package.json
directories:
  output: release-portable
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ViewerHDL-${version}-${arch}.${ext}
