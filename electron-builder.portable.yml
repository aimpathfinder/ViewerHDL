appId: com.kianv.netlistviewer
productName: KianV Netlist Viewer
asar: true
asarUnpack:
  - tools/**/*
files:
  - dist/**/*
  - electron/**/*
  - tools/**/*
  - package.json
directories:
  output: release-portable
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: KianV-Netlist-Viewer-${version}-${arch}.${ext}
